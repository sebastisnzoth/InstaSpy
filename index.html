<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InstaSpy — perfiles permitidos</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color-scheme: dark; }
    body { margin:0; background:#0b0b0f; color:#f5f5f7; }
    main { max-width:900px; margin:auto; padding:48px 20px; }
    .card { background:#15151c; border:1px solid #2a2a35; border-radius:18px; padding:22px; margin:18px 0; }
    h1 { margin:0 0 8px; font-size:34px; }
    p { color:#b9b9c5; line-height:1.5; }
    .buttons { display:flex; gap:12px; flex-wrap:wrap; margin:22px 0; }
    button { border:0; border-radius:12px; padding:12px 16px; font-weight:700; cursor:pointer; }
    button.primary { background:#fff; color:#111; }
    button.secondary { background:#292936; color:#fff; }
    .muted { color:#8f8f9e; font-size:14px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
    .stat { background:#101016; border-radius:14px; padding:14px; }
    .stat b { display:block; font-size:22px; margin-top:4px; }
    .post { padding:14px 0; border-top:1px solid #2a2a35; }
    a { color:#b9d7ff; }
    img.avatar { width:92px; height:92px; border-radius:50%; object-fit:cover; }
    .profile-head { display:flex; gap:18px; align-items:center; }
    #status { min-height:24px; }
  </style>
</head>
<body>
<main>
  <h1>InstaSpy</h1>
  <p>Consulta información pública/visible de las dos cuentas habilitadas.</p>

  <div class="buttons">
    <button class="primary" onclick="loadProfile('pao.arandaok')">@pao.arandaok</button>
    <button class="secondary" onclick="loadProfile('costapalomashowroom')">@costapalomashowroom</button>
  </div>

  <div id="status" class="muted"></div>
  <section id="result"></section>

  <p class="muted">La app no intenta acceder a cuentas privadas ni saltar restricciones de Instagram. Instagram puede limitar consultas automatizadas.</p>
</main>
<script>
const esc = (s='') => String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

async function loadProfile(username) {
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  status.textContent = `Consultando @${username}...`;
  result.innerHTML = '';
  try {
    const res = await fetch(`/api/profile?username=${encodeURIComponent(username)}`, {cache:'no-store'});
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'No se pudo consultar');
    const d = json.data;
    status.textContent = '';
    result.innerHTML = `
      <div class="card">
        <div class="profile-head">
          <img class="avatar" src="${esc(d.profile_pic_url)}" alt="avatar">
          <div>
            <h2>@${esc(d.username)}</h2>
            <div>${esc(d.full_name || '')}</div>
            <div class="muted">${d.is_private ? 'Cuenta privada' : 'Cuenta pública'}${d.is_verified ? ' · Verificada' : ''}</div>
          </div>
        </div>
        <p>${esc(d.biography || '')}</p>
        <div class="grid">
          <div class="stat">Seguidores<b>${Number(d.followers).toLocaleString()}</b></div>
          <div class="stat">Seguidos<b>${Number(d.followees).toLocaleString()}</b></div>
          <div class="stat">Publicaciones<b>${Number(d.mediacount).toLocaleString()}</b></div>
        </div>
      </div>
      <div class="card">
        <h3>Publicaciones recientes visibles</h3>
        ${d.posts.length ? d.posts.map(p => `
          <div class="post">
            <b>${new Date(p.date).toLocaleString()}</b>
            <div class="muted">${p.is_video ? 'Video' : 'Imagen/carrusel'} · ${p.likes} likes · ${p.comments} comentarios</div>
            <p>${esc(p.caption || '')}</p>
            <a href="${esc(p.url)}" target="_blank" rel="noopener">Abrir publicación</a>
          </div>`).join('') : '<p class="muted">No se obtuvieron publicaciones visibles. Puede deberse a privacidad o a límites de Instagram.</p>'}
      </div>`;
  } catch (err) {
    status.textContent = `Error: ${err.message}`;
  }
}
</script>
</body>
</html>
